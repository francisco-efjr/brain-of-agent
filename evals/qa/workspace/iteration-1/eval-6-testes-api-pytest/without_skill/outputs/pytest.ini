[pytest]
testpaths = tests
pythonpath = tests
addopts = -ra --strict-markers
markers =
    contrato: valida o formato das respostas contra os schemas do OpenAPI
    seguranca: autenticação, autorização (acesso à conta de outro titular) e vazamento de dados
    muta_estado: move centavos entre as contas de teste de homologação (exclui com -m "not muta_estado")
    premissa: comportamento que o OpenAPI NAO especifica; reflete uma expectativa razoavel (exclui com -m "not premissa")
    consome_limite: gasta o limite diario da conta A; so roda com RODAR_TESTES_LIMITE_DIARIO=1
