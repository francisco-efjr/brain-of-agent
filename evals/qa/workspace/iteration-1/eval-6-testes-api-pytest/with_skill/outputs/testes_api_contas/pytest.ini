[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    inferido: asserção sobre comportamento que o contrato OpenAPI não escreve (status de caso omisso, header de cache, fuso do filtro de datas); ajuste se o time decidir diferente
    destrutivo: move valores altos ou consome o limite diário; só roda com RUN_TESTES_DESTRUTIVOS=1
