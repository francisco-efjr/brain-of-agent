name: Brain of Agent integrity and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify catalog and imported source
        run: python tools/verify.py
      - name: Validate QA benchmark structure (no model execution)
        run: python tools/qa_eval.py validate
      - name: Validate fullstack benchmark structure (no model execution)
        run: python tools/qa_eval.py --base brains/fullstack/evals validate
      - name: QA helper regressions
        run: python -m unittest discover -s brains/qa/tests -v
      - name: Integration regressions
        run: python -m unittest discover -s tests -v
      - name: Fullstack synthetic fixture regressions (no model execution)
        run: python -m unittest discover -s brains/fullstack/evals/fixtures/tenant-edit -v
