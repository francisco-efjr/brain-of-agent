<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro no Programa de Benefícios</title>
  <style>
    :root {
      --texto: #1f1f1f;      /* 16,5:1 sobre branco */
      --texto-suave: #595959; /* 7,0:1 */
      --borda: #767676;      /* 4,5:1 (mínimo exigido para componente: 3:1) */
      --foco: #005fcc;       /* 6,0:1 */
      --erro: #b00020;       /* 7,3:1 */
      --acao: #00539b;       /* 7,8:1 com texto branco */
    }
    body { font-family: Arial, sans-serif; font-size: 1rem; line-height: 1.5; color: var(--texto); background: #fff; margin: 0; }
    header, main { max-width: 40rem; margin: 0 auto; padding: 16px; }
    header img { max-width: 100%; height: auto; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    .campo { margin: 20px 0; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    .dica { color: var(--texto-suave); font-size: 0.9375rem; margin: 0 0 4px; }
    input[type="text"], input[type="email"], input[type="password"] {
      box-sizing: border-box; width: 100%; min-height: 44px; padding: 8px 12px;
      font: inherit; color: var(--texto); border: 1px solid var(--borda); border-radius: 4px;
    }
    input[aria-invalid="true"] { border: 2px solid var(--erro); }
    .erro-texto { color: var(--erro); font-weight: bold; margin: 4px 0 0; }
    .erro-texto:empty { display: none; }
    /* foco sempre visível (2.4.7) e com contraste (1.4.11) */
    :focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; }
    .opcao { display: flex; align-items: flex-start; gap: 12px; font-weight: normal; min-height: 44px; margin: 0; }
    .opcao input { flex: none; width: 24px; height: 24px; margin: 10px 0 0; }
    .opcao span { padding-top: 8px; }
    button { min-height: 44px; padding: 8px 24px; font: inherit; font-weight: bold; color: #fff; background: var(--acao); border: 2px solid var(--acao); border-radius: 4px; cursor: pointer; }
    #resumo, #msg { border: 3px solid var(--erro); padding: 12px 16px; margin: 16px 0; }
    #msg { border-color: #1b5e20; }
    #msg:empty, #resumo[hidden] { display: none; }
    #resumo h2 { font-size: 1.125rem; margin: 0 0 8px; color: var(--erro); }
    #resumo ul { margin: 0; padding-left: 20px; }
    #resumo a { color: var(--erro); }
    a { color: #0b3d91; }
  </style>
</head>
<body>
  <header>
    <!-- TROCAR o alt pelo nome oficial do município. Se a imagem for só decorativa, alt="" -->
    <img src="logo-prefeitura.png" alt="Prefeitura Municipal">
  </header>

  <main>
    <h1>Cadastro no Programa de Benefícios</h1>
    <p>Todos os campos são obrigatórios.</p>

    <!-- Região de status: existe vazia desde o carregamento, para o leitor de tela anunciar o texto inserido depois. -->
    <div id="msg" role="status" tabindex="-1"></div>

    <!-- Resumo de erros: recebe o foco quando o envio falha. -->
    <div id="resumo" role="alert" tabindex="-1" hidden>
      <h2>Corrija os campos abaixo para continuar</h2>
      <ul id="lista-erros"></ul>
    </div>

    <form id="f" novalidate>
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" autocomplete="name" required aria-describedby="nome-erro">
        <p class="erro-texto" id="nome-erro"></p>
      </div>

      <div class="campo">
        <label for="cpf">CPF</label>
        <p class="dica" id="cpf-dica">Pode digitar só os números ou com pontos e traço. Exemplo: 123.456.789-09</p>
        <input type="text" id="cpf" name="cpf" inputmode="numeric" autocomplete="off" required aria-describedby="cpf-dica cpf-erro">
        <p class="erro-texto" id="cpf-erro"></p>
      </div>

      <div class="campo">
        <label for="nasc">Data de nascimento</label>
        <p class="dica" id="nasc-dica">Dia, mês e ano. Exemplo: 25/12/1950</p>
        <input type="text" id="nasc" name="nascimento" inputmode="numeric" autocomplete="bday" required aria-describedby="nasc-dica nasc-erro">
        <p class="erro-texto" id="nasc-erro"></p>
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-erro">
        <p class="erro-texto" id="email-erro"></p>
      </div>

      <div class="campo">
        <label for="senha">Crie uma senha</label>
        <p class="dica" id="senha-dica">Use no mínimo 8 caracteres.</p>
        <input type="password" id="senha" name="senha" autocomplete="new-password" required aria-describedby="senha-dica senha-erro">
        <p class="erro-texto" id="senha-erro"></p>
        <label class="opcao" for="ver-senha">
          <input type="checkbox" id="ver-senha">
          <span>Mostrar senha</span>
        </label>
      </div>

      <div class="campo">
        <label class="opcao" for="termos">
          <input type="checkbox" id="termos" name="termos" required aria-describedby="termos-erro">
          <!-- TROCAR href pelo endereço real dos termos (hoje o link do original é "#") -->
          <span>Li e aceito os <a href="termos.html">termos de uso</a></span>
        </label>
        <p class="erro-texto" id="termos-erro"></p>
      </div>

      <button type="submit">Enviar cadastro</button>
    </form>
  </main>

  <script>
    (function () {
      var form = document.getElementById('f');
      var resumo = document.getElementById('resumo');
      var lista = document.getElementById('lista-erros');
      var msg = document.getElementById('msg');

      function soDigitos(v) { return v.replace(/\D/g, ''); }

      function cpfValido(v) {
        var d = soDigitos(v);
        if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
        function dv(base) {
          var soma = 0;
          for (var i = 0; i < base.length; i++) soma += Number(base[i]) * (base.length + 1 - i);
          var r = (soma * 10) % 11;
          return r === 10 ? 0 : r;
        }
        return dv(d.slice(0, 9)) === Number(d[9]) && dv(d.slice(0, 10)) === Number(d[10]);
      }

      function dataValida(v) {
        var d = soDigitos(v);
        if (d.length !== 8) return false;
        var dia = Number(d.slice(0, 2)), mes = Number(d.slice(2, 4)), ano = Number(d.slice(4));
        var dt = new Date(ano, mes - 1, dia);
        return ano >= 1900 && dt.getFullYear() === ano && dt.getMonth() === mes - 1 &&
               dt.getDate() === dia && dt <= new Date();
      }

      // Cada regra devolve o texto do erro ou '' quando o campo está válido.
      var regras = {
        nome: function (el) { return el.value.trim() ? '' : 'Informe seu nome completo.'; },
        cpf: function (el) {
          if (!el.value.trim()) return 'Informe seu CPF.';
          return cpfValido(el.value) ? '' : 'CPF inválido. Confira os 11 números; pode digitar com ou sem pontos e traço.';
        },
        nasc: function (el) {
          if (!el.value.trim()) return 'Informe sua data de nascimento.';
          return dataValida(el.value) ? '' : 'Data inválida. Use dia, mês e ano, por exemplo 25/12/1950.';
        },
        email: function (el) {
          if (!el.value.trim()) return 'Informe seu e-mail.';
          return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(el.value.trim()) ? '' : 'E-mail inválido. Use o formato nome@exemplo.com.';
        },
        senha: function (el) { return el.value.length >= 8 ? '' : 'A senha precisa ter no mínimo 8 caracteres.'; },
        termos: function (el) { return el.checked ? '' : 'Para continuar, aceite os termos de uso.'; }
      };

      function mostrarErro(el, texto) {
        document.getElementById(el.id + '-erro').textContent = texto; // vazio = some (CSS :empty)
        if (texto) el.setAttribute('aria-invalid', 'true'); else el.removeAttribute('aria-invalid');
      }

      function montarResumo(erros) {
        lista.textContent = '';
        erros.forEach(function (e) {
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.href = '#' + e.el.id;
          a.textContent = e.texto;
          a.addEventListener('click', function (ev) { ev.preventDefault(); e.el.focus(); });
          li.appendChild(a);
          lista.appendChild(li);
        });
        resumo.hidden = false;
        resumo.focus();
      }

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        msg.textContent = '';
        var erros = [];
        Object.keys(regras).forEach(function (id) {
          var el = document.getElementById(id);
          var texto = regras[id](el);
          mostrarErro(el, texto);
          if (texto) erros.push({ el: el, texto: texto });
        });
        if (erros.length) { montarResumo(erros); return; }
        resumo.hidden = true;
        // TODO: enviar ao back-end. Em produção, mostrar número de protocolo e manter a
        // confirmação na tela (sem sumir sozinha); o original apagava a mensagem em 2 s.
        msg.textContent = 'Cadastro realizado com sucesso.';
        msg.focus();
      });

      // Ao corrigir um campo marcado como inválido, o erro some na hora (o original nunca limpava).
      form.addEventListener('input', function (ev) {
        var el = ev.target;
        if (regras[el.id] && el.getAttribute('aria-invalid') === 'true') mostrarErro(el, regras[el.id](el));
      });

      document.getElementById('ver-senha').addEventListener('change', function (ev) {
        document.getElementById('senha').type = ev.target.checked ? 'text' : 'password';
      });
    })();
  </script>
</body>
</html>
