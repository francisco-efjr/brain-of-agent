name: Brain of Agent integrity and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify catalog and imported source
        run: python3 tools/verify.py
      - name: Validate QA benchmark structure (no model execution)
        run: python3 tools/qa_eval.py validate
      - name: QA helper regressions
        run: python3 -m unittest discover -s brains/qa/tests -v
      - name: Integration regressions
        run: python3 -m unittest discover -s tests -v
