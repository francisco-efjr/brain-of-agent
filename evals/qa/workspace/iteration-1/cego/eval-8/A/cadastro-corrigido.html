<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro no Programa de Benefícios – Prefeitura de [Município]</title>
  <style>
    /* Contrastes calculados sobre fundo branco:
       texto 16,5:1 | apoio 7:1 | borda de campo 4,5:1 | ação/foco 8,4:1 | erro 7,3:1 | sucesso 6,7:1 */
    :root {
      --texto: #1f1f1f;
      --apoio: #595959;
      --borda: #767676;
      --acao: #0b4f8a;
      --erro: #b00020;
      --ok: #0a6b2d;
      --fundo: #fff;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;          /* respeita a preferência de tamanho do usuário */
      line-height: 1.5;
      color: var(--texto);
      background: var(--fundo);
      margin: 0;
    }
    .conteudo { max-width: 36rem; margin: 0 auto; padding: 1rem; }
    h1 { font-size: 1.5rem; line-height: 1.25; }
    a { color: var(--acao); }

    /* Link "pular para o conteúdo": só aparece quando recebe foco */
    .pular { position: absolute; left: -999rem; }
    .pular:focus { position: static; display: inline-block; padding: .5rem; }

    /* Foco SEMPRE visível (WCAG 2.4.7) */
    :focus-visible { outline: 3px solid var(--acao); outline-offset: 2px; }

    .campo { margin: 0 0 1.25rem; }
    label { display: block; font-weight: bold; margin-bottom: .25rem; }
    .dica { margin: 0 0 .25rem; color: var(--apoio); font-size: .9375rem; }
    input[type="text"], input[type="email"], input[type="password"], input[type="date"] {
      box-sizing: border-box;
      width: 100%;
      min-height: 2.75rem;
      padding: .5rem;
      font: inherit;
      color: var(--texto);
      background: var(--fundo);
      border: 2px solid var(--borda);   /* contraste >= 3:1 (WCAG 1.4.11) */
      border-radius: 4px;
    }
    input[aria-invalid="true"] { border-color: var(--erro); }

    /* Caixa de seleção: alvo de toque confortável (WCAG 2.5.8) */
    .opcao { display: flex; align-items: flex-start; gap: .5rem; }
    .opcao input { width: 1.5rem; height: 1.5rem; margin: .125rem 0 0; flex: none; }
    .opcao label { font-weight: normal; margin: 0; }

    .erro-msg { margin: .25rem 0 0; color: var(--erro); font-weight: bold; }
    .resumo { border: 3px solid var(--erro); padding: 1rem; margin-bottom: 1.5rem; }
    .resumo h2 { margin: 0 0 .5rem; font-size: 1.125rem; color: var(--erro); }
    .resumo ul { margin: 0; padding-left: 1.25rem; }
    .sucesso { border: 3px solid var(--ok); padding: 1rem; margin-bottom: 1.5rem; color: var(--ok); font-weight: bold; }

    .botao {
      min-height: 2.75rem;
      padding: .5rem 1.5rem;
      font: inherit;
      font-weight: bold;
      color: #fff;
      background: var(--acao);
      border: 2px solid var(--acao);   /* borda mantém o botão visível em modo de alto contraste */
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <a class="pular" href="#conteudo">Ir para o formulário</a>

  <header class="conteudo">
    <!-- Trocar pelo nome real do município. Se o logo for apenas decorativo e o nome já estiver no texto, usar alt="" -->
    <img src="logo-prefeitura.png" alt="Prefeitura de [Município]" height="64">
  </header>

  <main id="conteudo" class="conteudo" tabindex="-1">
    <h1>Cadastro no Programa de Benefícios</h1>

    <div id="msg" class="sucesso" role="status" tabindex="-1" hidden></div>

    <div id="resumo" class="resumo" role="alert" tabindex="-1" hidden>
      <h2>Há campos que precisam de correção</h2>
      <ul id="resumo-lista"></ul>
    </div>

    <form id="f" novalidate>
      <p class="dica">Todos os campos são obrigatórios.</p>

      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" autocomplete="name" required aria-describedby="nome-erro">
        <p class="erro-msg" id="nome-erro" hidden></p>
      </div>

      <div class="campo">
        <label for="cpf">CPF</label>
        <p class="dica" id="cpf-dica">Digite os 11 números. Pode usar pontos e traço. Exemplo: 123.456.789-09</p>
        <!-- sem maxlength=11: ele cortava CPF colado com pontos e traço -->
        <input type="text" id="cpf" name="cpf" inputmode="numeric" autocomplete="off" required aria-describedby="cpf-dica cpf-erro">
        <p class="erro-msg" id="cpf-erro" hidden></p>
      </div>

      <div class="campo">
        <label for="nasc">Data de nascimento</label>
        <input type="date" id="nasc" name="nasc" autocomplete="bday" required aria-describedby="nasc-erro">
        <p class="erro-msg" id="nasc-erro" hidden></p>
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" spellcheck="false" required aria-describedby="email-erro">
        <p class="erro-msg" id="email-erro" hidden></p>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <!-- CONFIRMAR COM O NEGÓCIO: a regra é "mínimo de 8" ou "exatamente 8"? O texto original era ambíguo. -->
        <p class="dica" id="senha-dica">Use pelo menos 8 caracteres.</p>
        <input type="password" id="senha" name="senha" autocomplete="new-password" required aria-describedby="senha-dica senha-erro">
        <p class="erro-msg" id="senha-erro" hidden></p>
        <div class="opcao" style="margin-top:.5rem">
          <input type="checkbox" id="ver-senha">
          <label for="ver-senha">Mostrar senha</label>
        </div>
      </div>

      <div class="campo">
        <div class="opcao">
          <input type="checkbox" id="termos" name="termos" required aria-describedby="termos-erro">
          <!-- Trocar "termos.html" pela página real dos termos -->
          <label for="termos">Li e aceito os <a href="termos.html">termos de uso</a></label>
        </div>
        <p class="erro-msg" id="termos-erro" hidden></p>
      </div>

      <button type="submit" class="botao">Enviar cadastro</button>
    </form>
  </main>

  <script>
    (function () {
      var form = document.getElementById('f');
      var resumo = document.getElementById('resumo');
      var lista = document.getElementById('resumo-lista');
      var msg = document.getElementById('msg');

      function cpfValido(valor) {
        var d = valor.replace(/\D/g, '');
        if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
        for (var t = 9; t < 11; t++) {
          var soma = 0;
          for (var i = 0; i < t; i++) soma += Number(d.charAt(i)) * (t + 1 - i);
          if (((soma * 10) % 11) % 10 !== Number(d.charAt(t))) return false;
        }
        return true;
      }

      function hojeISO() {
        var h = new Date();
        var m = ('0' + (h.getMonth() + 1)).slice(-2);
        var dia = ('0' + h.getDate()).slice(-2);
        return h.getFullYear() + '-' + m + '-' + dia;
      }

      // Cada regra devolve o texto do erro (string) ou '' se o campo estiver ok.
      var regras = [
        { id: 'nome', rotulo: 'Nome completo', validar: function (el) {
            // Não exigir sobrenome: há pessoas com nome único e isso as excluiria do programa.
            return el.value.trim() ? '' : 'Informe seu nome completo.'; } },
        { id: 'cpf', rotulo: 'CPF', validar: function (el) {
            if (!el.value.trim()) return 'Informe seu CPF.';
            return cpfValido(el.value) ? '' : 'O CPF informado não é válido. Confira os 11 números. Exemplo: 123.456.789-09.'; } },
        { id: 'nasc', rotulo: 'Data de nascimento', validar: function (el) {
            if (!el.value) return 'Informe sua data de nascimento.';
            if (el.value > hojeISO() || el.value < '1900-01-01') return 'A data de nascimento informada não é válida.';
            return ''; } },
        { id: 'email', rotulo: 'E-mail', validar: function (el) {
            if (!el.value.trim()) return 'Informe seu e-mail.';
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(el.value.trim()) ? '' : 'Informe um e-mail válido. Exemplo: nome@exemplo.com.br.'; } },
        { id: 'senha', rotulo: 'Senha', validar: function (el) {
            return el.value.length >= 8 ? '' : 'A senha deve ter pelo menos 8 caracteres.'; } },
        { id: 'termos', rotulo: 'Termos de uso', validar: function (el) {
            return el.checked ? '' : 'Para se cadastrar, é preciso aceitar os termos de uso.'; } }
      ];

      function marcar(id, texto) {
        var campo = document.getElementById(id);
        var aviso = document.getElementById(id + '-erro');
        if (texto) {
          campo.setAttribute('aria-invalid', 'true');
          aviso.textContent = 'Erro: ' + texto;   // o texto "Erro:" evita depender só da cor
          aviso.hidden = false;
        } else {
          campo.removeAttribute('aria-invalid');
          aviso.textContent = '';
          aviso.hidden = true;
        }
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        msg.hidden = true;
        msg.textContent = '';
        lista.innerHTML = '';
        var primeiro = null;

        regras.forEach(function (r) {
          var el = document.getElementById(r.id);
          var texto = r.validar(el);
          marcar(r.id, texto);
          if (texto) {
            var li = document.createElement('li');
            var a = document.createElement('a');
            a.href = '#' + r.id;
            a.textContent = r.rotulo + ': ' + texto;
            a.addEventListener('click', function (ev) { ev.preventDefault(); el.focus(); });
            li.appendChild(a);
            lista.appendChild(li);
            if (!primeiro) primeiro = el;
          }
        });

        if (primeiro) {
          resumo.hidden = false;
          resumo.focus();          // leva teclado e leitor de tela direto ao resumo
          return;
        }

        resumo.hidden = true;
        // TODO: enviar os dados ao back-end aqui e só exibir o sucesso após a resposta positiva.
        msg.textContent = 'Cadastro realizado com sucesso.';   // permanece na tela (sem timeout)
        msg.hidden = false;
        msg.focus();
      });

      document.getElementById('ver-senha').addEventListener('change', function (e) {
        document.getElementById('senha').type = e.target.checked ? 'text' : 'password';
      });
    })();
  </script>
</body>
</html>
